<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site 06</title>
</head>
<body>
    <form name="signup" target="_blank" action="https://meusite.com.br/signup" method="post">

        <h1>Formulário de Contato</h1>
        <input type="text" name="nome" placeholder="Digite seu nome" required><br><br>

        <input type="email" name="email" placeholder="Digite seu email" required><br><br>

        <input type="password" name="senha" placeholder="Digite sua senha" required><br><br>

        <input type="number" name="idade" placeholder="Digite sua idade" required><br><br>

        <label>Button: </label> <input type="button" value="Clique aqui" onclick="alert('Você clicou no botão!')"><br><br>
        
        <button type="submit">Enviar</button>

        <label>Range: </label> <input type="range" name="range" min="0" max="100" value="50"><br><br>

        <label>Color: </label> <input type="color" name="cor" value="#ff0000"><br><br>

        <label> url: </label> <input type="url" name="site" placeholder="Digite a URL do seu site"><br><br>

        <label>Date: </label> <input type="date" name="data"><br><br>

        <label>Time: </label> <input type="time" name="hora"><br><br>

        <label>Month</label> <input type="month" name="mes"><br><br>

        <label>Checkbox</label> <input type="checkbox" name="aceito" value="sim"> Aceito os termos e condições<br><br>

        <label>Radio</label>
        <input type="radio" name="genero" value="masculino"> Masculino
        <input type="radio" name="genero" value="feminino"> Feminino<br><br>

        <label>File</label> <input type="file" name="arquivo"><br><br>

        <label>Search</label> <input type="search" name="pesquisa" placeholder="Digite sua pesquisa"><br><br>

        <label>Hidden:</label> <input type="hidden" name="oculto" value="valor_oculto"><br><br>

        


        

        
    </form>

    <img src="https://i.pinimg.com/736x/83/a6/07/83a607ab6c10ca5facbc22552491edc6.jpg" alt="Imagem de Pokémon" width="300">
</body>
</html>
</html>
