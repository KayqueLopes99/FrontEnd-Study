<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site 05</title>
</head>
<body>
    <form name="signup" target="_blank" action="https://meusite.com.br/signup" method="post">

        <h1>Formulário de Contato</h1>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" required><br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea name="mensagem" rows="4" cols="50" required></textarea><br><br>

        <button type="submit">Enviar</button>

        
    </form>

    <img src="https://i.pinimg.com/736x/83/a6/07/83a607ab6c10ca5facbc22552491edc6.jpg" alt="Imagem de Pokémon" width="300">
</body>
</html>
</html>
