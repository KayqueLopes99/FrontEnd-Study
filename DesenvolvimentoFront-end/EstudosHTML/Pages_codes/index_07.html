<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site 06</title>
</head>
<body>
    <form name="signup" target="_blank" action="https://meusite.com.br/signup" method="post">

        <h1>Formulário</h1>
        <p>Quais animes você gosta?</p>
        <input type="checkbox" name="anime[]" value="Naruto"> Naruto<br>
        <input type="checkbox" name="anime[]" value="One Piece"> One Piece<br>
        <input type="checkbox" name="anime[]" value="Dragon Ball"> Dragon Ball<br>
        <input type="checkbox" name="anime[]" value="Attack on Titan"> Attack on Titan<br>
        <input type="checkbox" name="anime[]" value="My Hero Academia"> My Hero Academia<br><br>
        
        <p>Qual é o seu gênero favorito?</p>
        <input type="radio" name="genero" value="Ação"> Ação
        <input type="radio" name="genero" value="Comédia"> Comédia
        <input type="radio" name="genero" value="Romance"> Romance
        <input type="radio" name="genero" value="Fantasia"> Fantasia
        <input type="radio" name="genero" value="Terror"> Terror<br><br>
        
        <button type="submit">Enviar</button>
    </form>

    <img src="https://i.pinimg.com/736x/64/9c/15/649c15045eaaca5e1ba1253661a60ce9.jpg" alt="Imagem de Pokémon" width="300">
</body>
</html>
</html>
